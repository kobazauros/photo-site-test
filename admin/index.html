<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Decap will mount itself here -->
    <div id="nc-root"></div>

    <!-- Load Decap *after* the body exists -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
    // Always init the widget so netlifyIdentity is defined.
    netlifyIdentity.init();

    // If we landed here with an invite token or recovery token in the URL,
    // open the right modal automatically so you can finish setup / set password.
    (function () {
        const hash = window.location.hash || "";

        if (hash.includes('invite_token')) {
        // User clicked the "Accept Invite" link
        netlifyIdentity.on("init", () => {
            netlifyIdentity.open("signup");
        });
        } else if (hash.includes('recovery_token')) {
        // User clicked the "Recovery / Set Password" link
        netlifyIdentity.on("init", () => {
            netlifyIdentity.open("recovery");
        });
        }
    })();
    </script>

  </body>
</html>
