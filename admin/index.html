<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Content Manager</title>
  </head>
  <body>
    <div id="nc-root"></div>

    <!-- Load Netlify Identity Widget FIRST -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
      // Helper: only call this once, after we know the user is authenticated
      function loadCMS() {
        if (window.__CMS_LOADED__) return; // guard so we don't double-load
        window.__CMS_LOADED__ = true;

        const script = document.createElement("script");
        script.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
        document.body.appendChild(script);
      }

      // Initialize Netlify Identity
      netlifyIdentity.init();

      // Support special first-time / recovery flows from email links
      const hash = window.location.hash || "";

      if (hash.includes("invite_token")) {
        // First-time invite: open signup so you can set password
        netlifyIdentity.on("init", () => {
          netlifyIdentity.open("signup");
        });

        // After successful signup/login, load CMS
        netlifyIdentity.on("login", user => {
          if (user) {
            loadCMS();
          }
        });

      } else if (hash.includes("recovery_token")) {
        // Password recovery / reset flow
        netlifyIdentity.on("init", () => {
          netlifyIdentity.open("recovery");
        });

        netlifyIdentity.on("login", user => {
          if (user) {
            loadCMS();
          }
        });

      } else {
        // Normal /admin/ visit
        netlifyIdentity.on("init", user => {
          if (user) {
            // already logged in -> just load the CMS
            loadCMS();
          } else {
            // not logged in -> show login modal once
            netlifyIdentity.open("login");

            // when login succeeds, load CMS and close modal
            netlifyIdentity.on("login", u => {
              if (u) {
                netlifyIdentity.close();
                loadCMS();
              }
            });
          }
        });
      }

      // If the user logs out from the widget while on /admin/,
      // bounce them back to homepage (public site).
      netlifyIdentity.on("logout", () => {
        window.location.replace("/");
      });
    </script>
  </body>
</html>
