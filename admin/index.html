<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Content Manager</title>
  </head>
  <body>
    <div id="nc-root"></div>

    <!-- 1. Load Netlify Identity Widget first -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
      // Helper: load Decap CMS script dynamically only when allowed
      function loadCMS() {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
        document.body.appendChild(script);
      }

      // Init identity
      netlifyIdentity.init();

      const hash = window.location.hash || "";

      // Case A: invite flow (first-time account setup)
      if (hash.includes('invite_token')) {
        netlifyIdentity.on('init', () => {
          // show signup modal so you can finish + set password
          netlifyIdentity.open('signup');
        });

        // after signup/login succeeds, load the CMS
        netlifyIdentity.on('login', user => {
          if (user) {
            loadCMS();
          }
        });
      }

      // Case B: password recovery / set password
      else if (hash.includes('recovery_token')) {
        netlifyIdentity.on('init', () => {
          netlifyIdentity.open('recovery');
        });

        netlifyIdentity.on('login', user => {
          if (user) {
            loadCMS();
          }
        });
      }

      // Case C: normal visit to /admin/
      else {
        // Wait for identity to init, then check if user is already logged in
        netlifyIdentity.on('init', user => {
          if (user) {
            // already authenticated => load CMS directly
            loadCMS();
          } else {
            // not logged in => open login modal (this modal has "Forgot your password?")
            netlifyIdentity.open('login');
            // and when you do log in, load CMS
            netlifyIdentity.on('login', u => {
              if (u) {
                loadCMS();
              }
            });
          }
        });
      }

      // Optional: if the user logs out from the widget while on /admin/,
      // kick them back to homepage so strangers can't sit on /admin/.
      netlifyIdentity.on('logout', () => {
        window.location.replace('/');
      });
    </script>
  </body>
</html>
