backend:
  name: github
  repo: kobazauros/photo-site-test
  branch: main
  base_url: https://kevinroden.netlify.app
  auth_endpoint: /api/auth

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "models"
    label: "Models"
    label_singular: "Model Set"
    folder: "content/models"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { name: "name", label: "Model Name", widget: "string" }
      - { name: "title", label: "Session Title / Location", widget: "string" }
      - { name: "cover", label: "Cover Image", widget: "image", hint: "Used as the tile thumbnail on the Models page." }
      - label: "Gallery Images"
        name: "images"
        widget: "list"
        hint: "Upload the full web-sized set."
        field:
          name: "image"
          label: "Image"
          widget: "image"

  - name: "nature"
    label: "Nature"
    label_singular: "Nature Set"
    folder: "content/nature"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { name: "name", label: "Series Name", widget: "string" }
      - { name: "title", label: "Location / Mood", widget: "string" }
      - { name: "cover", label: "Cover Image", widget: "image" }
      - label: "Gallery Images"
        name: "images"
        widget: "list"
        field:
          name: "image"
          label: "Image"
          widget: "image"
