    <title>Kevin Roden Photography</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- NAV -->
    <header class="main-nav">
        <div class="nav-logo">
            <a href="index.html">KEVIN RODEN</a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="models.html">Figures</a></li>
                <li><a href="nature.html">Forms</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-inner">
            <h1 class="hero-name">KEVIN RODEN</h1>
            <p class="hero-tagline">Decisive Light. Honest Vision.</p>
        </div>
    </section>

    <!-- PORTALS -->
    <section class="portals-section">
        <div class="container portals">

            <a href="models.html" class="portal-card" id="portal-models">
                <div class="portal-card-overlay"></div>
                <div class="portal-card-label">
                    <h2>Portraits & Postures</h2>
                </div>
            </a>

            <a href="nature.html" class="portal-card" id="portal-nature">

    <footer class="main-footer">

    </footer>

    <script src="script.js"></script>
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
    // Always init the widget so netlifyIdentity is defined.
    netlifyIdentity.init();

    // If we landed here with an invite token or recovery token in the URL,
    // open the right modal automatically so you can finish setup / set password.
    (function () {
        const hash = window.location.hash || "";

        if (hash.includes('invite_token')) {
        // User clicked the "Accept Invite" link
        netlifyIdentity.on("init", () => {
            netlifyIdentity.open("signup");
        });
        } else if (hash.includes('recovery_token')) {
        // User clicked the "Recovery / Set Password" link
        netlifyIdentity.on("init", () => {
            netlifyIdentity.open("recovery");
        });
        }
    })();
    </script>

</body>
</html>
